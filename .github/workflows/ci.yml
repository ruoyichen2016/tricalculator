name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: check (fmt / clippy / test / package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Architecture guardrails
        run: bash scripts/check_architecture.sh

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::too_many_arguments -A clippy::large_enum_variant -A clippy::manual_div_ceil -A clippy::needless_return_with_question_mark -A clippy::needless_borrow -A clippy::unnecessary_get_then_check -A clippy::useless_vec -A clippy::collapsible_if -A clippy::field_reassign_with_default

      - name: Test
        run: cargo test --workspace

      - name: Build CLI
        run: cargo build -q -p pcgen-cli

      - name: CLI smoke
        run: ./target/debug/pcgen demo

      - name: Mini import smoke
        run: ./target/debug/pcgen import-report tests/fixtures/campaign-mini/mini.pcc

      - name: Package tooling dry-run
        run: python3 scripts/test_package.py
