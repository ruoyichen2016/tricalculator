[workspace]
resolver = "2"
members = [
    "crates/pcgen-core",
    "crates/pcgen-formula",
    "crates/pcgen-ir",
    "crates/pcgen-import",
    "crates/pcgen-engine",
    "crates/pcgen-builder",
    "crates/pcgen-output",
    "crates/pcgen-cli",
    "crates/pcgen-transpile",
    "crates/pcgen-web",
]

# A dev build was 15 GiB, and 92% of that was DWARF.  Measured, from clean:
#
#   15.0 GiB  default (`debug = true` everywhere)
#    4.2 GiB  dependencies only
#    1.9 GiB  line-tables-only for this workspace, nothing for dependencies
#
# The bulk is not the dependency tree — it is this workspace's 45 test targets,
# each statically linking tokio, axum and serde with debug info.
#
# `line-tables-only` keeps file:line in backtraces, so a panic still reports
# where it happened; it drops variable inspection, which nothing here uses.
[profile.dev]
debug = "line-tables-only"

# None of a dependency's debug info is ever looked at — when something breaks
# you debug this workspace's crates, not tokio's internals.
[profile.dev.package."*"]
debug = false

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1"
repository = "https://github.com/pcgen/PCGen"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
clap = { version = "4", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
