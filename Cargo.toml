[workspace]
resolver = "2"
members = [
    "crates/pcgen-core",
    "crates/pcgen-formula",
    "crates/pcgen-ir",
    "crates/pcgen-import",
    "crates/pcgen-engine",
    "crates/pcgen-builder",
    "crates/pcgen-output",
    "crates/pcgen-cli",
    "crates/pcgen-transpile",
    "crates/pcgen-web",
]

# A dev build was 15 GiB, and 92% of that was DWARF for the 87 dependencies
# (tokio, axum, hyper, syn, regex, clap).  None of it is ever looked at — when
# something breaks you debug this workspace's crates, not tokio's internals.
#
# Measured: 15.0 GiB with default debug info, 1.2 GiB with `debug = 0`
# everywhere.  This keeps the workspace's own crates debuggable and drops the
# dependencies.
[profile.dev.package."*"]
debug = false

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1"
repository = "https://github.com/pcgen/PCGen"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
clap = { version = "4", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
