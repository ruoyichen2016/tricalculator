[workspace]
resolver = "2"
members = [
    "crates/pcgen-core",
    "crates/pcgen-formula",
    "crates/pcgen-ir",
    "crates/pcgen-import",
    "crates/pcgen-engine",
    "crates/pcgen-builder",
    "crates/pcgen-output",
    "crates/pcgen-cli",
    "crates/pcgen-web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1"
repository = "https://github.com/pcgen/PCGen"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
clap = { version = "4", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
