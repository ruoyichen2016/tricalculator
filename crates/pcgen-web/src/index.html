<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PCGen-Rust Web</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 70rem; }
  h1 { margin-bottom: 0.25rem; }
  form { display: grid; gap: 0.5rem; max-width: 40rem; margin: 1rem 0 1.5rem; }
  label { font-weight: 600; }
  input { padding: 0.35rem; font: inherit; }
  button { padding: 0.45rem 0.9rem; font: inherit; cursor: pointer; }
  pre { background: #f5f5f5; padding: 0.75rem; overflow: auto; max-height: 22rem; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .card { border: 1px solid #ddd; padding: 1rem; border-radius: 6px; }
  .error { color: #b00020; font-weight: 600; }
  iframe { width: 100%; height: 30rem; border: 1px solid #ddd; border-radius: 6px; }
</style>
</head>
<body>
<h1>PCGen-Rust Web</h1>
<p>Local API: <code>POST /api/recalculate</code> with <code>{ "pcc": "...", "pcg": "..." }</code>.</p>

<form id="form">
  <label for="pcc">Campaign (.pcc path relative to data root)</label>
  <input id="pcc" name="pcc" size="70"
         value="data/35e/wizards_of_the_coast/rsrd/basics/_rsrd_basics.pcc">
  <label for="pcg">Character (.pcg path relative to data root)</label>
  <input id="pcg" name="pcg" size="70"
         value="code/testsuite/PCGfiles/35e_Bard.pcg">
  <button type="submit">Recalculate</button>
</form>
<p id="status"></p>

<div class="grid">
  <div class="card">
    <h2>Snapshot</h2>
    <pre id="snapshot"></pre>
  </div>
  <div class="card">
    <h2>Choices / Pools</h2>
    <pre id="choices"></pre>
    <h2>Diagnostics</h2>
    <pre id="diagnostics"></pre>
  </div>
</div>

<h2>Rendered HTML sheet</h2>
<iframe id="sheet" title="sheet"></iframe>

<script>
const form = document.getElementById('form');
const status = document.getElementById('status');
const snapshotEl = document.getElementById('snapshot');
const choicesEl = document.getElementById('choices');
const diagnosticsEl = document.getElementById('diagnostics');
const sheetEl = document.getElementById('sheet');

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  status.className = '';
  status.textContent = 'Running…';
  snapshotEl.textContent = '';
  choicesEl.textContent = '';
  diagnosticsEl.textContent = '';
  sheetEl.srcdoc = '';
  try {
    const response = await fetch('/api/recalculate', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        pcc: document.getElementById('pcc').value,
        pcg: document.getElementById('pcg').value,
      }),
    });
    const data = await response.json();
    if (!response.ok) {
      status.className = 'error';
      status.textContent = data.error || 'request failed';
      return;
    }
    status.textContent = 'OK';
    snapshotEl.textContent = JSON.stringify(data.snapshot, null, 2);
    choicesEl.textContent = JSON.stringify({
      choices: data.choices,
      unresolved_choices: data.unresolved_choices,
      ability_pool_usage: data.ability_pool_usage,
    }, null, 2);
    diagnosticsEl.textContent = data.diagnostics.join('\n');
    sheetEl.srcdoc = data.html;
  } catch (error) {
    status.className = 'error';
    status.textContent = String(error);
  }
});
</script>
</body>
</html>
